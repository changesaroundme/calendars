# sources.yaml — every page Changes Around Me monitors: what feeds a calendar,
# what the web archive captures, and what the Links page lists. Grouped by
# organisation; a child page (a board's meeting-content page, a survey sub-page)
# nests under its parent and shares its line in the Links table. A page states
# only what differs from the defaults: file-wide, then the organisation's, each
# either for all pages or for one kind — `calendar-pages` (the page has a
# `calendar:`, so the build fetches it) or `other-pages` (kept for the archive).
#
#   calendar  which .ics it feeds
#   expect   always | sporadic | every N year(s) [from YYYY] Mon[-Mon] | ...
#   check     twice daily | daily | weekly | every N days
#   archive   yes/no — the archive job keeps PDF captures of it
#   parse     ics | rss | api | html | html-table | pdf | claude | manual | none
#   status    active | paused | retired
#   public   yes/no — listed on the Links page
#   added     YYYY-MM-DD
#   note     free text, never read by code
#
# The build validates this file on every run (caltools/registry.py).

defaults:
  status: active
  public: yes
  calendar-pages: {expect: always, check: twice daily, archive: no, parse: html}
  other-pages: {expect: sporadic, check: every 3 days, archive: yes, parse: none}


# One-off events, maintained by hand. Each entry is merged into the org
# calendar named by `org:` (and into all.ics) on the next build.
#
# Workflow: edit this file directly, or drop a link in events/inbox.md and
# have a Claude session extract the details — then review the git diff and
# push as usual. Run `python build.py --offline` to validate before
# pushing; a malformed entry turns CI red (naming the entry) but never
# blocks the valid ones.
#
# Fields:
#   summary:   (required) title EXACTLY as it should appear in calendars,
#              including any org prefix, e.g. "TxDOT - I-35 CapEx Open House"
#   start:     (required) 2026-09-15 for all-day, 2026-09-15 17:30 for timed
#   org:       (required) which calendar it lands in — one of:
#              campo capmetro txdot lcra ctrma austin atp txdotev
#              legislature
#   end:       optional. Timed events default to start + 2h. For multi-day
#              all-day events, `end:` is the LAST day (inclusive).
#   location:  optional street address
#   url:       optional link to the announcement page
#   kind:      optional — regular (default) | work-session | special |
#              budget | hearing | comment-window | engagement
#   status:    optional — write "cancelled" to strike the event through
#              (keep the entry so subscribers see the cancellation!)
#   description: optional extra text shown in the event body
#   uid:       optional, normally omitted — auto-derived from summary+date.
#              NOTE: renaming a summary therefore creates a NEW event for
#              subscribers. To rename without churn, first copy the old uid
#              from data/<org>.json into an explicit `uid:` line.
#              ALSO the dedupe mechanism: if a scraper covers the same
#              meeting (build log warns "possible duplicate"), pin this to
#              the scraped event's uid (find it in data/<org>.json) — the
#              curated entry then REPLACES the scraped copy everywhere.
#
# Housekeeping: past events can be pruned whenever; deleting one removes it
# from the published calendars but it stays in git history.
#
# Example (delete the leading "# " to activate):
# - summary: "TxDOT - I-35 Capital Express Central Open House"
#   start: 2026-09-15 17:30
#   org: txdotev
#   location: "Austin High School Cafeteria, 1715 W. Cesar Chavez St., Austin, TX"
#   url: https://my35capex.com/events/example
#   kind: engagement


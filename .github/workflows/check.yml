name: Check

# Runs on every pull request: the offline build, which uses the saved
# fixtures (no network) and runs every self-test, including the checks on
# sources.yaml and projects.yaml. Nothing is published from here.
on:
  pull_request:

permissions:
  contents: read

jobs:
  offline-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline build
        run: python build.py --offline

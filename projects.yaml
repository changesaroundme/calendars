# projects.yaml — what Changes Around Me follows: individual projects, plans
# and policies, one entry each. An entry states only what is known; the
# defaults fill in the rest.
#
#   slug         permanent short name, lowercase-with-hyphens
#   name         as it reads on the site
#   kind         project | plan | policy
#   tier         focus (Ian has written a page) | watching (the default)
#   orgs         who runs it: codes from sources.yaml, or `organizations` below
#   page         the vault page, for a focus project
#   sources      monitored pages about it (slugs in sources.yaml)
#   links        other pages worth having: [{name: ..., url: ...}]
#   also_called  other names it goes by
#   match        other wording that means it on an agenda (see "Meetings" below)
#   schedule     what has been said about its timing (see below)
#   added        YYYY-MM-DD
#   note         free text, never read by code
#
# `schedule` is a list of statements, oldest first. A statement is what one
# source said at one moment. It is never edited afterwards: when the source
# says something new, a new statement goes below it. The latest statement is
# the current schedule, and the earlier ones show how far it has moved.
#
#   source     who or what said it
#   url        where, if anywhere
#   dated      the date the source carries: YYYY, YYYY-MM or YYYY-MM-DD
#   retrieved  the day it was read, when the source carries no date
#   capture    our dated copy in the archive, if there is one
#   about      what it covers, when not the whole project
#   from_notes yes when the statement is the author's own record of what the
#              author was told (a conversation, a timeline handed over) rather
#              than a document: `said` is then that note, not a quotation
#   note       free text, shown beside the statement
#   phases     [{name, said, start, end}]: `said` is the wording as published,
#              `start` and `end` are how it was read. Only one of them = a
#              milestone: `start` for something that happens or begins then,
#              `end` for a deadline or a completion.
#
# Vague wording is read the same way every time: spring Mar–May, summer
# Jun–Aug, fall Sep–Nov; early Jan–Apr, mid May–Aug, late Sep–Dec; early or
# late in a season is its first or last month ("late spring" is May). "Winter
# 2027" is the exception: sources use it for either end of the year, so it is
# read as January–February or as December from the order the source lists
# things in or from what else the page says, and the note says which way.
# The wording stays in `said`, so nobody has to trust the reading.
#
# Meetings. A meeting on the calendars is listed under a project when its
# title, its agenda or its description uses one of the project's names:
# `name`, `also_called` or `match`. Only whole words count ("290 Extension" is
# not found in "1290 Extensions"). Capital letters, accents and the kind of
# dash make no difference, and "&" is the same as "and"; but a name written
# all in capitals (UTP) has to be in capitals on the agenda too.
#
#   To tie more meetings to a project, add the wording to its `match` list,
#   one line each, with a note of where the wording was seen:
#       match:
#         - Plaza Saltillo Rail Station expansion   # CapMetro Board agenda, 16 Nov 2026
#   A wording goes in only if every meeting that uses it is about the project.
#   A wording with a colon in it needs quotes: - "City Council: Budget Meeting"
#
#   To undo a wrong match, add one line to `wrong_matches` at the end of this
#   file. docs/projects.md lists every match with that line ready to copy.
#       - {project: SLUG, meeting: ID}        takes that one meeting away
#       - {project: SLUG, wording: WORDS}     a longer wording that has the
#                                             name in it but means something
#                                             else, wherever it appears
#   Either line can also carry `note: why`. A meeting that is moved gets a new
#   ID, so its line has to be copied again; the build says when that happens.
#
# Checked by caltools/projects.py:  python -m caltools.projects

defaults:
  tier: watching
  added: 2026-11-16

organizations:            # only those sources.yaml does not already have
  SGI: Something Good Initiative

